name: vivuviet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vivuviet-backend:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-project}
      DB_USERNAME: ${DB_USERNAME:-vivuviet}
      DB_PASSWORD: ${DB_PASSWORD:-vivuviet_dev_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-only-change-me-32-chars-min}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 40s
    mem_limit: 1g

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-project}
      POSTGRES_USER: ${DB_USERNAME:-vivuviet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vivuviet_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  db-data:
