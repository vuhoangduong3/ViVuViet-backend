spring.application.name=Vi-vu-Viet

# Load .env as Java properties from the project directory (next to pom.xml).
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/project
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.auth.jwt-secret=${AUTH_JWT_SECRET}
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.unicorns.backend=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
